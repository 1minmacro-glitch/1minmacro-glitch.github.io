<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>준현 인생 대시보드</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --card:           #ffffff;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --good:           #0ca30c;

    --cat-asset:   #2a78d6; /* 자산 */
    --cat-workout: #1baf7a; /* 운동 */
    --cat-dn8:     #eda100; /* DN8 */
    --cat-study:   #008300; /* 공부 */
    --cat-ai:      #4a3aa7; /* AI프로젝트 */
    --cat-invest:  #e34948; /* 투자 */
    --cat-love:    #e87ba4; /* 연애 */
    --cat-happy:   #eb6834; /* 행복도 */
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --card:           #232322;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --good:           #0ca30c;
      --cat-asset:   #3987e5;
      --cat-workout: #199e70;
      --cat-dn8:     #c98500;
      --cat-study:   #008300;
      --cat-ai:      #9085e9;
      --cat-invest:  #e66767;
      --cat-love:    #d55181;
      --cat-happy:   #d95926;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --card:           #232322;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --cat-asset:   #3987e5;
    --cat-workout: #199e70;
    --cat-dn8:     #c98500;
    --cat-study:   #008300;
    --cat-ai:      #9085e9;
    --cat-invest:  #e66767;
    --cat-love:    #d55181;
    --cat-happy:   #d95926;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    padding: 24px 16px 80px;
  }
  .page-layout {
    display: flex; gap: 20px; max-width: 1120px; margin: 0 auto;
    align-items: flex-start; justify-content: center;
  }
  .wrap { max-width: 780px; width: 100%; margin: 0; }
  .sidebar { width: 300px; flex-shrink: 0; }
  @media (max-width: 1100px) {
    .page-layout { flex-direction: column; align-items: stretch; }
    .sidebar { width: 100%; }
  }

  .marathon-panel h3 {
    font-size: 13px; font-weight: 700; margin: 18px 0 8px; color: var(--text-secondary);
    display: flex; align-items: center; gap: 5px;
  }
  .marathon-panel h3:first-child { margin-top: 4px; }
  .race-item {
    padding: 10px 12px; border-bottom: 1px solid var(--gridline); font-size: 12.5px;
  }
  .race-item:last-child { border-bottom: none; }
  .race-item .race-name { font-weight: 700; color: var(--text-primary); }
  .race-item .race-date { color: var(--cat-dn8); font-weight: 600; margin-top: 2px; }
  .race-item .race-reg { color: var(--text-muted); margin-top: 2px; }
  .race-item .race-warn { color: var(--cat-invest); font-size: 11px; margin-top: 2px; }
  .race-item a { color: var(--cat-asset); font-size: 11px; text-decoration: none; }
  .race-item a:hover { text-decoration: underline; }
  .marathon-note {
    font-size: 11px; color: var(--text-muted); padding: 10px 12px 4px; line-height: 1.5;
  }
  .marathon-note a { color: var(--cat-asset); }

  .region-tabs {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px;
  }
  .region-tab {
    font-size: 12px; color: var(--text-secondary); background: rgba(127,127,127,0.10);
    border: 1px solid transparent; border-radius: 999px; padding: 5px 11px; cursor: pointer;
  }
  .region-tab:hover { background: rgba(127,127,127,0.18); }
  .region-tab.active {
    background: var(--cat-dn8); color: #fff; font-weight: 700;
  }

  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 22px; margin: 0 0 4px; }
  header .sub { color: var(--text-secondary); font-size: 14px; }
  .theme-toggle {
    position: fixed; top: 16px; right: 16px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 12px; font-size: 13px;
    cursor: pointer; color: var(--text-secondary);
  }

  .points-bar {
    display: flex; justify-content: center; align-items: baseline; gap: 8px;
    margin-bottom: 20px;
  }
  .points-bar .num { font-size: 32px; font-weight: 700; font-variant-numeric: normal; }
  .points-bar .label { color: var(--text-secondary); font-size: 14px; }

  .date-nav {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 12px; font-size: 14px; color: var(--text-secondary);
  }
  .date-nav button {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 10px; cursor: pointer; color: var(--text-primary); font-size: 13px;
  }
  .date-nav .today-label { font-weight: 600; color: var(--text-primary); min-width: 150px; text-align: center; }

  section { margin-bottom: 28px; }
  section > h2 {
    font-size: 15px; font-weight: 700; margin: 0 0 10px;
    display: flex; align-items: center; gap: 6px;
  }
  section > h2 .count { color: var(--text-muted); font-weight: 500; font-size: 13px; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 4px;
  }

  .quest {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-bottom: 1px solid var(--gridline);
    cursor: pointer; user-select: none;
    transition: opacity .15s;
  }
  .quest:last-child { border-bottom: none; }
  .quest:hover { background: rgba(127,127,127,0.06); }
  .quest .box {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    border: 2px solid var(--cat-color, var(--text-muted));
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--card);
    transition: background .15s;
  }
  .quest.done .box { background: var(--cat-color, var(--good)); }
  .quest .icon { font-size: 16px; }
  .quest .label { flex: 1; font-size: 14px; }
  .quest.done .label { color: var(--text-muted); text-decoration: line-through; }
  .quest .tag {
    font-size: 11px; color: var(--card); background: var(--cat-color, var(--text-muted));
    padding: 2px 8px; border-radius: 999px; flex-shrink: 0;
  }
  .quest-group-header {
    font-size: 11px; font-weight: 700; color: var(--text-muted);
    padding: 12px 14px 4px; letter-spacing: .2px;
  }
  .quest-group-header:first-child { padding-top: 8px; }

  /* 주간 카운터 항목(러닝/등산 등 — 주에 여러 번 체크 가능) */
  .counter-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .ctr-btn {
    width: 26px; height: 26px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card); color: var(--text-primary); font-size: 16px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    line-height: 1;
  }
  .ctr-btn:hover { background: rgba(127,127,127,0.14); }
  .ctr-num { font-size: 13px; font-weight: 700; min-width: 30px; text-align: center; color: var(--text-primary); }

  .stat-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  @media (max-width: 560px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat-tile {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; text-align: center;
  }
  .stat-tile .icon { font-size: 20px; }
  .stat-tile .name { font-size: 12px; color: var(--text-secondary); margin: 4px 0 6px; }
  .stat-tile .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-tile .bar { height: 4px; border-radius: 2px; background: var(--gridline); margin-top: 8px; overflow: hidden; }
  .stat-tile .bar > i { display: block; height: 100%; border-radius: 2px; }
  .stat-delta-row { margin-top: 6px; }
  .stat-delta { font-size: 10.5px; font-weight: 700; }
  .stat-delta.up { color: var(--good); }
  .stat-delta.down { color: var(--cat-invest); }
  .stat-delta.flat { color: var(--text-muted); }

  .week-grid {
    display: grid; grid-template-columns: 90px repeat(7, 1fr); gap: 4px; font-size: 12px;
  }
  .week-grid .cat-name {
    display: flex; align-items: center; gap: 4px; color: var(--text-secondary);
    padding: 4px 2px;
  }
  .week-grid .day-head {
    text-align: center; color: var(--text-muted); padding-bottom: 4px; font-weight: 600;
  }
  .week-grid .cell {
    aspect-ratio: 1; border-radius: 4px; background: var(--gridline);
  }
  .week-grid .cell.on { background: var(--dot-color, var(--good)); }
  .week-grid .cell.today { box-shadow: 0 0 0 2px var(--text-primary) inset; }

  .goal-list .quest .box { border-radius: 999px; }

  footer.note {
    text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 32px;
  }

  /* 보상 팝업 */
  #reward-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  #reward-overlay.show { display: flex; }
  #reward-card {
    background: var(--card); border-radius: 16px; padding: 32px 28px; text-align: center;
    max-width: 300px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: pop .25s ease;
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #reward-card .emoji { font-size: 44px; margin-bottom: 8px; }
  #reward-card .title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  #reward-card .desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
  #reward-card .pts { font-size: 20px; font-weight: 700; color: var(--good); margin-bottom: 18px; }
  #reward-card button {
    background: var(--text-primary); color: var(--card); border: none;
    border-radius: 999px; padding: 8px 22px; font-size: 14px; cursor: pointer;
  }

  /* 운동 항목 자세보기 아코디언 */
  .quest .expand-btn {
    flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--cat-workout);
    background: rgba(27,175,122,0.14); border: 1px solid var(--cat-workout);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; white-space: nowrap;
  }
  .quest .expand-btn:hover { background: rgba(27,175,122,0.24); }
  .exercise-panel {
    max-height: 0; overflow: hidden; transition: max-height .28s ease;
    border-bottom: 0 solid var(--gridline);
    background: rgba(127,127,127,0.04);
  }
  .exercise-panel.open { max-height: 600px; border-bottom-width: 1px; }
  .exercise-panel .inner { padding: 6px 14px 14px 48px; }
  .exercise-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 0; border-bottom: 1px dashed var(--gridline); font-size: 13px;
  }
  .exercise-item:last-child { border-bottom: none; }
  .exercise-item .ex-name { color: var(--text-primary); }
  .exercise-item .ex-reps { color: var(--text-muted); font-size: 12px; margin-left: 8px; }
  .exercise-item a {
    color: var(--cat-workout); text-decoration: none; font-size: 12px;
    background: rgba(27,175,122,0.12); padding: 4px 9px; border-radius: 999px;
    flex-shrink: 0; margin-left: 10px;
  }
  .exercise-item a:hover { text-decoration: underline; }

  /* 보너스 박스 */
  #lootbox-btn {
    position: fixed; right: 18px; bottom: 18px; z-index: 90;
    background: linear-gradient(135deg, #eda100, #eb6834);
    color: #fff; border: none; border-radius: 999px;
    padding: 14px 20px; font-size: 14px; font-weight: 700; cursor: pointer;
    box-shadow: 0 8px 24px rgba(235,104,52,0.4);
    display: none; animation: floatBounce 1.4s ease-in-out infinite;
  }
  #lootbox-btn.show { display: block; }
  @keyframes floatBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  #lootbox-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center; z-index: 110;
  }
  #lootbox-overlay.show { display: flex; }
  #lootbox-card {
    background: var(--card); border-radius: 16px; padding: 32px 28px; text-align: center;
    max-width: 300px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    animation: pop .25s ease;
  }
  #lootbox-card .emoji { font-size: 52px; margin-bottom: 8px; }
  #lootbox-card .title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  #lootbox-card .desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
  #lootbox-card .pts { font-size: 22px; font-weight: 700; color: var(--cat-dn8); margin-bottom: 18px; min-height: 27px; }
  #lootbox-card button {
    background: linear-gradient(135deg, #eda100, #eb6834); color: #fff; border: none;
    border-radius: 999px; padding: 9px 24px; font-size: 14px; cursor: pointer; font-weight: 700;
  }
  #lootbox-card.opening .emoji { animation: shake .5s ease; }
  @keyframes shake {
    0%,100% { transform: rotate(0); }
    20% { transform: rotate(-12deg); }
    40% { transform: rotate(10deg); }
    60% { transform: rotate(-8deg); }
    80% { transform: rotate(6deg); }
  }

  /* 칠판 / 완료기록 공용 아이템 */
  .board-item { padding: 10px 12px; border-bottom: 1px solid var(--gridline); font-size: 12.5px; }
  .board-item:last-child { border-bottom: none; }
  .board-item .board-date { color: var(--text-muted); font-size: 11px; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
  .board-item .board-text { color: var(--text-primary); line-height: 1.5; }
  .board-item .board-src {
    color: #fff; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
  }

  /* 날씨 위젯 */
  .weather-summary { padding: 10px 12px; font-size: 12.5px; color: var(--cat-workout); font-weight: 700; }
  .weather-grid { display: flex; overflow-x: auto; gap: 6px; padding: 0 12px 12px; }
  .weather-hour {
    flex-shrink: 0; text-align: center; font-size: 11px; padding: 8px 6px; border-radius: 8px;
    background: rgba(127,127,127,0.06); min-width: 44px;
  }
  .weather-hour.rec { background: rgba(27,175,122,0.18); border: 1px solid var(--cat-workout); }
  .weather-hour .wh-time { color: var(--text-muted); }
  .weather-hour .wh-temp { font-weight: 700; margin: 4px 0; }
  .weather-hour .wh-pop { color: var(--cat-asset); }

  /* 할 일 트래커 */
  .todo-input-row { display: flex; gap: 8px; padding: 10px 12px; }
  .todo-input-row input {
    flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    background: var(--card); color: var(--text-primary); font-size: 14px;
  }
  .todo-input-row button {
    background: var(--text-primary); color: var(--card); border: none; border-radius: 8px;
    padding: 8px 14px; cursor: pointer; font-size: 14px;
  }
  .todo-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border-bottom: 1px solid var(--gridline); cursor: pointer;
  }
  .todo-item:last-child { border-bottom: none; }
  .todo-item:hover { background: rgba(127,127,127,0.06); }
  .todo-item .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--text-muted); flex-shrink: 0; }
  .todo-item .label { flex: 1; font-size: 14px; }
  .todo-log-item { padding: 10px 14px; border-bottom: 1px solid var(--gridline); font-size: 12.5px; }

  /* 답변 남기기 */
  .reply-box { padding: 10px 12px; }
  .reply-box textarea {
    width: 100%; min-height: 84px; resize: vertical; box-sizing: border-box;
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    background: var(--card); color: var(--text-primary); font-size: 13.5px; font-family: inherit;
  }
  .reply-btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .reply-btn-row button {
    border: none; border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 12.5px;
  }
  .reply-btn-row .copy-btn { background: var(--text-primary); color: var(--card); flex: 1; }
  .reply-btn-row .clear-btn { background: rgba(127,127,127,0.15); color: var(--text-primary); }
  .reply-status { font-size: 11.5px; color: var(--cat-workout); margin-top: 6px; min-height: 14px; }
  .todo-log-item:last-child { border-bottom: none; }
  .todo-log-item .log-date { color: var(--text-muted); font-size: 11px; }
  .todo-log-item .log-title { font-weight: 700; margin: 2px 0; }
  .todo-log-item .log-memo { color: var(--text-secondary); }

  #undo-toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--text-primary); color: var(--card); padding: 10px 18px; border-radius: 999px;
    font-size: 13px; display: none; align-items: center; gap: 12px; z-index: 120;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  #undo-toast.show { display: flex; }
  #undo-toast button { background: none; border: none; color: var(--cat-dn8); font-weight: 700; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle">🌓 테마</button>

<div class="page-layout">
<div class="wrap">
  <header>
    <h1>🎮 준현 인생 대시보드</h1>
    <div class="sub">오늘도 퀘스트 깨자</div>
  </header>

  <div class="points-bar">
    <div class="num" id="totalPoints">0</div>
    <div class="label">누적 포인트 · 총 <span id="totalDone">0</span>개 퀘스트 완료</div>
  </div>

  <div class="date-nav">
    <button id="prevDay">◀ 어제</button>
    <div class="today-label" id="dateLabel"></div>
    <button id="nextDay">내일 ▶</button>
    <button id="gotoToday">오늘로</button>
  </div>

  <section>
    <h2>📋 오늘의 퀘스트 <span class="count" id="questCount"></span></h2>
    <div class="card"><div id="questList"></div></div>
  </section>

  <section>
    <h2>📝 할 일 <span class="count" id="todoCount"></span></h2>
    <div class="card">
      <div class="todo-input-row">
        <input type="text" id="todoInput" placeholder="할 일 입력 후 Enter">
        <button id="todoAddBtn" type="button">추가</button>
      </div>
      <div id="todoList"></div>
    </div>
  </section>

  <section>
    <h2>🧠 오늘의 행복도</h2>
    <div class="card" style="padding:14px; display:flex; gap:8px; justify-content:center;" id="moodPicker"></div>
  </section>

  <section>
    <h2>📅 이번 주 체크 현황</h2>
    <div class="card" style="padding:14px;">
      <div class="week-grid" id="weekGrid"></div>
    </div>
  </section>

  <section>
    <h2>📊 인생 스탯</h2>
    <div class="stat-grid" id="statGrid"></div>
  </section>

  <section>
    <h2>🎯 올해 목표 <span class="count" id="goalCount"></span></h2>
    <div class="card goal-list"><div id="goalList"></div></div>
  </section>

  <section>
    <h2>📜 완료 기록</h2>
    <div class="card" id="todoLogList"></div>
  </section>

  <footer class="note">
    체크는 브라우저에 저장돼 — 이 파일을 그대로 두고 매번 열면 이어짐 (같은 브라우저 기준)<br>
    <span id="resetPoints" style="text-decoration:underline; cursor:pointer;">포인트만 0으로 초기화</span>
  </footer>
</div>

<aside class="sidebar">
  <div class="card marathon-panel" id="boardPanel"></div>
  <div class="card marathon-panel" id="replyPanel" style="margin-top:16px;"></div>
  <div class="card marathon-panel" id="channelPanel" style="margin-top:16px;"></div>

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

let checks   = load(LS.checks, {});
let goals    = load(LS.goals, null);
if (!goals) { goals = {}; GOALS.forEach(g => goals[g.id] = g.done0); save(LS.goals, goals); }

let moodAll  = load(LS.mood, {});
let weekly   = load(LS.weekly, {});
let pointLog = load(LS.pointLog, {});

let viewDate = new Date();

function dateStr(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function mondayOf(d) {
  const nd = new Date(d);
  const day = (nd.getDay() + 6) % 7; // 0=Mon
  nd.setDate(nd.getDate() - day);
  return dateStr(nd);
}
function isToday(d) { return dateStr(d) === dateStr(new Date()); }

// ── 보상 팝업 ───────────────────────────────────────────────────────
// key: 이 체크에 대한 고유 키 — 나중에 체크 해제되면 정확히 이만큼 환수(포인트 파밍 방지)
function showReward(key) {
  const r = REWARDS[Math.floor(Math.random() * REWARDS.length)];
  const pts = [10, 15, 20, 25, 30, 50][Math.floor(Math.random() * 6)];
  points += pts;
  pointLog[key] = pts;
  save(LS.points, points);
  save(LS.pointLog, pointLog);
  document.getElementById("rewardEmoji").textContent = r.emoji;
  document.getElementById("rewardTitle").textContent = r.title;
  document.getElementById("rewardDesc").textContent = r.desc;
  document.getElementById("rewardPts").textContent = "+" + pts + "P";
  document.getElementById("reward-overlay").classList.add("show");
  renderPoints();
}
document.getElementById("rewardClose").onclick = () => {
  document.getElementById("reward-overlay").classList.remove("show");
};

// 체크 해제 시 그 체크로 받았던 포인트만 정확히 환수 (보너스박스 포인트는 유지 — 그건 별도 이벤트)
function refundPoints(key) {
  const pts = pointLog[key];
  if (!pts) return;
  points -= pts;
  delete pointLog[key];
  save(LS.points, points);
  save(LS.pointLog, pointLog);
  renderPoints();
}

function renderPoints() {
  document.getElementById("totalPoints").textContent = points;
  let doneCount = 0;
  Object.values(checks).forEach(day => doneCount += Object.values(day).filter(Boolean).length);
  Object.values(weekly).forEach(wk => doneCount += Object.values(wk).filter(Boolean).length);
  document.getElementById("totalDone").textContent = doneCount;
}

// 같은 항목이 짧은 시간 안에 두 번 눌리는 걸 막는 디바운스 (중복 포인트 적립 방지)
let _lastToggleKey = null, _lastToggleAt = 0;
function _debounced(key) {
  const now = Date.now();
  if (key === _lastToggleKey && now - _lastToggleAt < 350) return true;
  _lastToggleKey = key; _lastToggleAt = now;
  return false;
}

function toggleCheck(ds, itemId) {
  if (_debounced("c:" + ds + ":" + itemId)) return;
  const key = "c:" + ds + ":" + itemId;
  if (!checks[ds]) checks[ds] = {};
  const nowOn = !checks[ds][itemId];
  checks[ds][itemId] = nowOn;
  save(LS.checks, checks);
  if (nowOn) { showReward(key); maybeSpawnLootBox(); } else { refundPoints(key); }
  renderAll();
}
function toggleWeekly(wk, itemId) {
  if (_debounced("w:" + wk + ":" + itemId)) return;
  const key = "w:" + wk + ":" + itemId;
  if (!weekly[wk]) weekly[wk] = {};
  const nowOn = !weekly[wk][itemId];
  weekly[wk][itemId] = nowOn;
  save(LS.weekly, weekly);
  if (nowOn) { showReward(key); maybeSpawnLootBox(); } else { refundPoints(key); }
  renderAll();
}
// counter:true 주간항목(러닝/등산 등) — weekly[wk]에 "itemId#1","itemId#2"... 식 서브키로 저장해서
// 기존 toggleWeekly/showReward/refundPoints/포인트로그를 그대로 재사용(탭당 정확히 환수 가능)
function weeklyCounterCount(wk, itemId) {
  const dayChecked = weekly[wk] || {};
  let n = 0;
  while (dayChecked[itemId + "#" + (n + 1)]) n++;
  return n;
}
function weeklyItemDone(wk, it) {
  if (it.counter) return weeklyCounterCount(wk, it.id) > 0;
  return !!((weekly[wk] || {})[it.id]);
}
function toggleGoal(id) {
  if (_debounced("g:" + id)) return;
  const key = "g:" + id;
  goals[id] = !goals[id];
  save(LS.goals, goals);
  if (goals[id]) { showReward(key); maybeSpawnLootBox(); } else { refundPoints(key); }
  renderGoals();
}

  WEEKLY_ITEMS.forEach(it => {
    const cat = CATS[it.cat];
    const row = document.createElement("div");

    if (it.counter) {
      const count = weeklyCounterCount(wk, it.id);
      row.className = "quest" + (count > 0 ? " done" : "");
      row.style.setProperty("--cat-color", cat.color);
      row.innerHTML = `
        <div class="box">${count > 0 ? "✓" : ""}</div>
        <div class="icon">${it.icon}</div>
        <div class="label">${it.label}</div>
        <div class="counter-controls">

      row.querySelector(".ctr-plus").onclick = (e) => { e.stopPropagation(); toggleWeekly(wk, it.id + "#" + (count + 1)); };
      row.querySelector(".ctr-minus").onclick = (e) => { e.stopPropagation(); if (count > 0) toggleWeekly(wk, it.id + "#" + count); };

function renderWeekGrid() {
  const wk = mondayOf(viewDate);
  const monday = new Date(wk);
  const dayLabels = ["월","화","수","목","금","토","일"];
  const grid = document.getElementById("weekGrid");
  grid.innerHTML = `<div></div>` + dayLabels.map(d => `<div class="day-head">${d}</div>`).join("");

  const catOrder = ["workout","study","invest","ai","dn8","asset","love","happy"];
  catOrder.forEach(catKey => {
    const cat = CATS[catKey];
    grid.innerHTML += `<div class="cat-name">${cat.icon} ${cat.name}</div>`;
    const weeklyForCat = WEEKLY_ITEMS.filter(w => w.cat === catKey);
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday); d.setDate(monday.getDate() + i);
      const ds = dateStr(d);
      const dow = d.getDay();
      const dayItems = (DAILY_ITEMS[dow] || []).filter(it => it.cat === catKey);
      const dayChecked = checks[ds] || {};
      let on = dayItems.some(it => dayChecked[it.id]);
      if (catKey === "happy") {
        on = moodAll[ds] >= 4;
      } else if (weeklyForCat.length && i === 6) {
        on = on || weeklyForCat.some(w => weeklyItemDone(wk, w)); // 주 항목은 마지막 칸에 요약 반영
      }
      const cellClass = "cell" + (on ? " on" : "") + (isToday(d) ? " today" : "");
      grid.innerHTML += `<div class="${cellClass}" style="--dot-color:${cat.color}"></div>`;
    }
  });
}

// 특정 주(월요일 기준 wk)의 카테고리별 완료/전체 계산 — 이번주 렌더와 지난주 비교 둘 다 재사용
function computeCatStats(catKey, wk) {
  const monday = new Date(wk);
  let done = 0, total = 0;

  if (catKey === "happy") {
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday); d.setDate(monday.getDate() + i);
      if (d > new Date()) continue;
      total++;
      if ((moodAll[dateStr(d)] || 0) >= 4) done++;
    }
    total = Math.max(total, 1);
  } else {
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday); d.setDate(monday.getDate() + i);
      const dow = d.getDay();
      const dayItems = (DAILY_ITEMS[dow] || []).filter(it => it.cat === catKey);
      const dayChecked = checks[dateStr(d)] || {};
      total += dayItems.length;
      done += dayItems.filter(it => dayChecked[it.id]).length;
    }
    const weeklyForCat = WEEKLY_ITEMS.filter(w => w.cat === catKey);
    if (weeklyForCat.length) {
      total += weeklyForCat.length;
      done += weeklyForCat.filter(w => weeklyItemDone(wk, w)).length;
    }
    total = Math.max(total, 1);
  }
  return { done, total, pct: Math.round((done / total) * 100) };
}

function renderStats() {
  const wk = mondayOf(viewDate);
  const prevMonday = new Date(wk); prevMonday.setDate(prevMonday.getDate() - 7);
  const prevWk = dateStr(prevMonday);
  const catOrder = ["asset","workout","dn8","study","ai","invest","love","happy"];
  const grid = document.getElementById("statGrid");
  grid.innerHTML = "";

  catOrder.forEach(catKey => {
    const cat = CATS[catKey];
    const cur = computeCatStats(catKey, wk);
    const prev = computeCatStats(catKey, prevWk);
    const delta = cur.pct - prev.pct;
    const deltaHtml = delta > 0
      ? `<span class="stat-delta up">▲${delta}%p</span>`
      : delta < 0
        ? `<span class="stat-delta down">▼${Math.abs(delta)}%p</span>`
        : `<span class="stat-delta flat">–</span>`;
    const { done, total, pct } = cur;
    const tile = document.createElement("div");
    tile.className = "stat-tile";
    tile.innerHTML = `
      <div class="icon">${cat.icon}</div>
      <div class="name">${cat.name}</div>
      <div class="val">${done}/${total}</div>
      <div class="bar"><i style="width:${pct}%; background:${cat.color};"></i></div>
      <div class="stat-delta-row" title="지난주 ${prev.pct}% → 이번주 ${cur.pct}%">${deltaHtml}</div>
    `;
    grid.appendChild(tile);
  });
}

function renderGoals() {
  const list = document.getElementById("goalList");
  list.innerHTML = "";
  let done = 0;
  GOALS.forEach(g => {
    const isDone = !!goals[g.id];
    if (isDone) done++;
    const row = document.createElement("div");
    row.className = "quest" + (isDone ? " done" : "");
    row.style.setProperty("--cat-color", "var(--good)");
    row.innerHTML = `
      <div class="box">${isDone ? "✓" : ""}</div>
      <div class="icon">🎯</div>
      <div class="label">${g.label}</div>
    `;
    row.onclick = () => toggleGoal(g.id);
    list.appendChild(row);
  });
  document.getElementById("goalCount").textContent = `${done}/${GOALS.length} 완료`;
}

function renderAll() {
  renderQuests();
  renderMood();
  renderWeekGrid();
  renderStats();
  renderGoals();
  renderPoints();

// 복사/붙여넣기 없이 브라우저에서 바로 GitHub repo의 dashboard/replies.json에 씀(GitHub Contents API, CORS 허용됨).
// 클로드는 세션 시작 시 이 파일을 git pull(또는 raw fetch)로 읽고, 처리 후 claude_reply를 채워서 다시 push함 — 그러면 이 페이지가 그 답변을 보여줌.
const GH_OWNER = "1minmacro-glitch";
const GH_REPO = "1minmacro-glitch.github.io";
const GH_PATH = "dashboard/replies.json";
const GH_RAW_URL = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main/${GH_PATH}?t=${Date.now()}`;

const LS_REPLY_DRAFT = "jh_reply_draft";
const LS_GH_PAT = "jh_gh_pat";
const LS_GH_PAT_DATE = "jh_gh_pat_date";
const PAT_EXPIRY_DAYS = 30;

function patExpiryNote() {
  const savedDate = localStorage.getItem(LS_GH_PAT_DATE);
  if (!savedDate) return "";
  const saved = new Date(savedDate);
  const expiry = new Date(saved.getTime() + PAT_EXPIRY_DAYS * 86400000);
  const daysLeft = Math.ceil((expiry - new Date()) / 86400000);
  const warn = daysLeft <= 5;
  const color = warn ? "var(--warn, #b23a22)" : "var(--text-muted)";
  return `<div style="font-size:11px; color:${color}; margin-top:4px;">토큰 만료 예정: ${expiry.toISOString().slice(0,10)} (D-${daysLeft})${warn ? " — 곧 새로 발급 필요" : ""}</div>`;
}

function renderReply() {
  const panel = document.getElementById("replyPanel");
  const token = localStorage.getItem(LS_GH_PAT);
  const draft = localStorage.getItem(LS_REPLY_DRAFT) || "";
  panel.innerHTML = `
    <h3>💬 답변 남기기</h3>
    <div class="reply-box">
      <textarea id="replyText" placeholder="클로드한테 남길 답변/메모 적기 (자동저장됨)">${draft}</textarea>
      <div class="reply-btn-row">
        <button class="copy-btn" id="replySubmitBtn">${token ? "제출하기" : "연결 설정 먼저"}</button>
        <button class="clear-btn" id="replySettingsBtn">⚙️ 연결설정</button>
      </div>
      ${token ? patExpiryNote() : ""}
      <div class="reply-status" id="replyStatus"></div>
      <div id="replySettingsBox" style="display:none; margin-top:8px; padding:10px; border:1px dashed var(--border); border-radius:8px; font-size:11.5px; color:var(--text-muted);">
        최초 1회 또는 만료 후 재발급: <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub 토큰 발급 페이지</a>에서 —
        Repository access: <b>Only select repositories → ${GH_REPO}</b>, Permissions: <b>Contents → Read and write</b>, Expiration: <b>30 days</b> 설정 후 발급.
        발급된 토큰(ghp_ 또는 github_pat_로 시작)을 아래에 붙여넣기(이 브라우저에만 저장됨, 서버로 안 감).
        <div style="display:flex; gap:6px; margin-top:6px;">
          <input type="password" id="ghPatInput" placeholder="여기에 토큰 붙여넣기" style="flex:1; border:1px solid var(--border); border-radius:6px; padding:6px 8px; background:var(--card); color:var(--text-primary); font-size:12px;">
          <button id="ghPatSaveBtn" style="border:none; border-radius:6px; padding:6px 10px; cursor:pointer; background:var(--text-primary); color:var(--card); font-size:12px;">저장</button>
        </div>
      </div>
      <div id="replyThread"></div>
    </div>`;

  const ta = document.getElementById("replyText");
  ta.oninput = () => localStorage.setItem(LS_REPLY_DRAFT, ta.value);
  const status = document.getElementById("replyStatus");

  document.getElementById("replySettingsBtn").onclick = () => {
    const box = document.getElementById("replySettingsBox");
    box.style.display = box.style.display === "none" ? "block" : "none";
  };
  document.getElementById("ghPatSaveBtn").onclick = () => {
    const v = document.getElementById("ghPatInput").value.trim();
    if (!v) return;
    localStorage.setItem(LS_GH_PAT, v);
    localStorage.setItem(LS_GH_PAT_DATE, new Date().toISOString());
    renderReply();
  };

  document.getElementById("replySubmitBtn").onclick = async () => {
    const t = localStorage.getItem(LS_GH_PAT);
    if (!t) { document.getElementById("replySettingsBox").style.display = "block"; return; }
    const text = ta.value.trim();
    if (!text) { status.textContent = "빈 내용은 제출 안 함"; return; }
    status.textContent = "전송 중...";
    try {
      const getRes = await fetch(GH_API_URL, { headers: { Authorization: `token ${t}` } });
      let sha, arr = [];
      if (getRes.ok) {
        const data = await getRes.json();
        sha = data.sha;
        arr = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, "")))));
      } else if (getRes.status !== 404) {
        throw new Error(`GET ${getRes.status}`);
      }
      arr.push({
        id: Date.now(),
        date: new Date().toISOString(),
        text,
        read: false,
        claude_reply: null,
        claude_reply_date: null,
      });
      const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(arr, null, 2))));
      const putRes = await fetch(GH_API_URL, {
        method: "PUT",
        headers: { Authorization: `token ${t}`, "Content-Type": "application/json" },
        body: JSON.stringify({ message: `답변 추가 ${new Date().toISOString()}`, content: b64, sha }),
      });
      if (!putRes.ok) throw new Error(`PUT ${putRes.status}`);
      status.textContent = "전송 완료 — 다음 세션에 클로드가 확인함";
      ta.value = ""; localStorage.removeItem(LS_REPLY_DRAFT);
      loadReplyThread();
    } catch (e) {
      status.textContent = `전송 실패(${e.message}) — 토큰 권한/만료 확인 필요`;
    }
  };

  loadReplyThread();
}

async function loadReplyThread() {
  const box = document.getElementById("replyThread");
  if (!box) return;
  try {
    // raw.githubusercontent.com은 Fastly CDN 캐시 때문에 push 후 몇 분씩 지연될 수 있어서
    // 캐시가 안 걸리는 GitHub Contents API로 직접 읽음(공개 저장소라 토큰 없이도 됨).
    const res = await fetch(GH_API_URL, { cache: "no-store", headers: { "Accept": "application/vnd.github.raw+json" } });
    if (!res.ok) { box.innerHTML = ""; return; }
    const arr = await res.json();
    if (!arr.length) { box.innerHTML = ""; return; }
    let html = `<div class="marathon-note" style="margin-top:10px;">지난 답변</div>`;
    arr.slice().reverse().slice(0, 5).forEach(item => {
      html += `<div class="board-item">
        <div class="board-date">${item.date.slice(0,16).replace("T"," ")} ${item.read ? "✅확인됨" : "⏳대기중"}</div>
        <div class="board-text">${item.text}</div>
        ${item.claude_reply ? `<div class="board-text" style="margin-top:6px; padding-top:6px; border-top:1px dashed var(--border); color:var(--cat-asset);">🤖 ${item.claude_reply}</div>` : ""}
      </div>`;
    });
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = "";
  }
}
renderReply();

const WEATHER_LAT = 35.8714, WEATHER_LON = 128.6014;
async function loadWeather() {
  const panel = document.getElementById("weatherPanel");
  panel.innerHTML = `<h3>🌤️ 대구 날씨 (오늘)</h3><div class="marathon-note">불러오는 중...</div>`;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&hourly=temperature_2m,precipitation_probability&timezone=Asia%2FSeoul&forecast_days=1`;
    const res = await fetch(url);
    const data = await res.json();
    const times = data.hourly.time, temps = data.hourly.temperature_2m, pops = data.hourly.precipitation_probability;
    let html = `<h3>🌤️ 대구 날씨 (오늘)</h3>`;
    let recRanges = [], curStart = null, rows = "";
    for (let i = 5; i <= 21; i++) {
      const idx = times.findIndex(t => t.endsWith(String(i).padStart(2, "0") + ":00"));
      if (idx === -1) continue;
      const temp = Math.round(temps[idx]);
      const pop = pops[idx];
      const rec = pop <= 30 && temp <= 33;
      if (rec) { if (curStart === null) curStart = i; }
      else { if (curStart !== null) { recRanges.push([curStart, i - 1]); curStart = null; } }
      rows += `<div class="weather-hour${rec ? " rec" : ""}"><div class="wh-time">${i}시</div><div class="wh-temp">${temp}°</div><div class="wh-pop">${pop}%</div></div>`;
    }
    if (curStart !== null) recRanges.push([curStart, 21]);
    if (recRanges.length) {
      const label = recRanges.map(r => r[0] === r[1] ? `${r[0]}시` : `${r[0]}~${r[1]}시`).join(", ");
      html += `<div class="weather-summary">🥾 등산 추천 시간대: ${label}</div>`;
    } else {
      html += `<div class="weather-summary" style="color:var(--cat-invest);">오늘은 추천 시간대 없음(더움/비)</div>`;
    }
    html += `<div class="weather-grid">${rows}</div>`;
    html += `<div class="marathon-note">Open-Meteo 실시간 API · 강수확률 30%↓ &amp; 기온 33도↓ 구간 자동 하이라이트</div>`;
    panel.innerHTML = html;
  } catch (e) {
    panel.innerHTML = `<h3>🌤️ 대구 날씨</h3><div class="marathon-note">불러오기 실패 — <a href="https://www.weather.go.kr/w/weather/forecast/short-term.do" target="_blank" rel="noopener">기상청에서 확인</a></div>`;
  }
}

let todoLog = load(LS_TODO_LOG, []);
let lastRemovedTodo = null, lastRemovedLog = null, undoTimer = null;

function renderTodos() {
  const list = document.getElementById("todoList");
  list.innerHTML = "";
  todos.forEach(t => {
    const row = document.createElement("div");
    row.className = "todo-item";
    row.innerHTML = `<div class="box"></div><div class="label">${t.text}</div>`;
    row.onclick = () => completeTodo(t.id);
    list.appendChild(row);
  });
  document.getElementById("todoCount").textContent = `${todos.length}개`;
}

function completeTodo(id) {
  const idx = todos.findIndex(t => t.id === id);
  if (idx === -1) return;
  const t = todos[idx];
  const memoResult = prompt(`"${t.text}" 완료! 어떻게/왜 완료했는지 메모 (취소하면 완료 취소되고 목록에 그대로 남음):`);
  if (memoResult === null) return; // 취소 → 완료 처리 안 함, 목록에 그대로 유지
  const memo = memoResult;
  todos.splice(idx, 1);
  save(LS_TODOS, todos);
  const logEntry = { id: t.id, text: t.text, memo, date: dateStr(new Date()) };
  todoLog.unshift(logEntry);
  save(LS_TODO_LOG, todoLog);
  points += 20; save(LS.points, points); renderPoints();

  lastRemovedTodo = { item: t, index: idx };
  lastRemovedLog = logEntry;
  showUndoToast(`"${t.text}" 완료 처리됨`);

  renderTodos();
  renderTodoLog();
}

function showUndoToast(msg) {
  clearTimeout(undoTimer);
  document.getElementById("undoText").textContent = msg;
  document.getElementById("undo-toast").classList.add("show");
  undoTimer = setTimeout(() => {
    document.getElementById("undo-toast").classList.remove("show");
    lastRemovedTodo = null; lastRemovedLog = null;
  }, 5000);
}

document.getElementById("undoBtn").onclick = () => {
  clearTimeout(undoTimer);
  document.getElementById("undo-toast").classList.remove("show");
  if (lastRemovedTodo) {
    todos.splice(lastRemovedTodo.index, 0, lastRemovedTodo.item);
    save(LS_TODOS, todos);
  }
  if (lastRemovedLog) {
    const i = todoLog.indexOf(lastRemovedLog);
    if (i !== -1) todoLog.splice(i, 1);
    save(LS_TODO_LOG, todoLog);
    points -= 20; save(LS.points, points); renderPoints();
  }
  lastRemovedTodo = null; lastRemovedLog = null;
  renderTodos();
  renderTodoLog();
};

function addTodo() {

  todos.push({ id: "t" + Date.now(), text });

}

    <div class="race-item">
      <div class="race-name">${r.name}</div>
      <div class="race-date">📅 ${r.date}</div>
      <div class="race-reg">📝 ${r.reg}</div>
      ${r.warn ? `<div class="race-warn">⚠️ ${r.warn}</div>` : ""}
      <a href="${r.link}" target="_blank" rel="noopener">→ 공식/상세 페이지</a>
    </div>`;
}

function renderMarathons() {
  const panel = document.getElementById("marathonPanel");

  let html = `<h3>🌏 세계 7대 마라톤 (2026)</h3>`;
  WORLD_MAJORS_2026.forEach(r => {
    html += `
      <div class="race-item">
        <div class="race-name">${r.name}</div>
        <div class="race-date">📅 ${r.date}</div>
        <div class="race-reg">📝 ${r.reg}</div>
      </div>`;
  });

  html += `<h3>🇰🇷 대한민국 마라톤 — 지역별</h3>`;
  html += `<div class="region-tabs" id="regionTabs">`;
  Object.keys(DOMESTIC_BY_REGION).forEach(key => {
    const active = key === activeRegion ? " active" : "";
    html += `<button class="region-tab${active}" data-region="${key}" type="button">${DOMESTIC_BY_REGION[key].label}</button>`;
  });
  html += `</div>`;
  html += `<div id="regionRaces"></div>`;

  html += `<div class="marathon-note">
    ※ 2026-07-19 기준 대구·경북 / 부산·울산·경남 위주로 직접 웹서치해서 채운 스냅샷 — 나머지 지역은 아직 하나하나 확인 못 해서 비어있음(억지로 채우면 틀린 정보 들어갈 위험). 필요한 지역 말해주면 그때그때 채워나갈게.
    이 파일은 정적 파일이라 실시간 자동 갱신은 안 됨.
    전국 목록은 <a href="https://marathongo.co.kr/raceSchedule/domestic" target="_blank" rel="noopener">마라톤GO</a>에서 직접 확인 가능.
  </div>`;

  panel.innerHTML = html;
  renderRegionRaces();

  document.querySelectorAll(".region-tab").forEach(btn => {
    btn.onclick = () => {
      activeRegion = btn.dataset.region;
      document.querySelectorAll(".region-tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderRegionRaces();
    };
  });
}

function renderRegionRaces() {
  const region = DOMESTIC_BY_REGION[activeRegion];
  const box = document.getElementById("regionRaces");
  if (!region.races.length) {
    box.innerHTML = `<div class="marathon-note">아직 이 지역은 조사해서 못 채웠음 — <a href="https://marathongo.co.kr/raceSchedule/domestic" target="_blank" rel="noopener">마라톤GO에서 지역필터로 확인</a></div>`;
    return;
  }
  box.innerHTML = region.races.map(raceItemHtml).join("");
}

renderMarathons();

function renderHiking() {
  const panel = document.getElementById("hikingPanel");
  let html = `<h3>⛰️ 대구 등산 코스</h3>`;
  HIKING_COURSES.forEach(h => {
    const imgQ = encodeURIComponent(h.name.split(" ")[0] + " 등산코스");
    const mapQ = encodeURIComponent(h.name.split(" ")[0]);
    html += `
      <div class="race-item">
        <div class="race-name">${h.name}</div>
        <div class="race-date">🥾 ${h.course}</div>
        <div class="race-reg">${h.info}</div>
        <div class="race-reg">${h.desc}</div>
        <a href="https://www.google.com/search?tbm=isch&q=${imgQ}" target="_blank" rel="noopener">📷 사진 보기</a>
        &nbsp;·&nbsp;
        <a href="https://map.naver.com/p/search/${mapQ}" target="_blank" rel="noopener">🗺 지도 보기</a>
      </div>`;
  });
  html += `<div class="marathon-note">대구 3대 명산 위주로 정리함 — 다른 산/지역도 필요하면 말해줘.</div>`;
  panel.innerHTML = html;
}
renderHiking();

document.getElementById("prevDay").onclick = () => { viewDate.setDate(viewDate.getDate() - 1); renderAll(); };
document.getElementById("nextDay").onclick = () => { viewDate.setDate(viewDate.getDate() + 1); renderAll(); };
document.getElementById("gotoToday").onclick = () => { viewDate = new Date(); renderAll(); };

document.getElementById("resetPoints").onclick = () => {
  if (!confirm("포인트를 0으로 초기화할까? (체크 기록/목표/달력은 그대로 유지됨)")) return;
  points = 0;
  pointLog = {};
  save(LS.points, points);
  save(LS.pointLog, pointLog);
  renderPoints();
};

document.getElementById("themeToggle").onclick = () => {
  const root = document.documentElement;
  const cur = root.getAttribute("data-theme");
  if (cur === "dark") root.setAttribute("data-theme", "light");
  else if (cur === "light") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", "dark");
};

// ── 보너스 미스터리 박스 (완료 시 25% 확률로 등장, 게임 로또박스 느낌) ────────
const BONUS_REWARDS = [
  { emoji: "💎", title: "대박! 다이아 등급", desc: "이번 주 최고의 발견." },
  { emoji: "🥇", title: "골드 박스", desc: "꾸준함이 만든 보너스." },
  { emoji: "🎊", title: "깜짝 잭팟", desc: "운도 실력이다." },
  { emoji: "⭐", title: "스타 보너스", desc: "오늘 제대로 달렸다." },
  { emoji: "🍀", title: "행운 박스", desc: "이 기세로 내일도." },
];
let lootboxPending = false;
let lootboxOpened = false;

function maybeSpawnLootBox() {
  if (lootboxPending) return;
  if (Math.random() < 0.25) {
    lootboxPending = true;
    document.getElementById("lootbox-btn").classList.add("show");
  }
}

document.getElementById("lootbox-btn").onclick = () => {
  document.getElementById("lootbox-btn").classList.remove("show");
  lootboxOpened = false;
  const card = document.getElementById("lootbox-card");
  card.classList.remove("opening");
  document.getElementById("lootboxEmoji").textContent = "🎁";
  document.getElementById("lootboxTitle").textContent = "미스터리 박스";
  document.getElementById("lootboxDesc").textContent = "눌러서 열어보기";
  document.getElementById("lootboxPts").textContent = "";
  document.getElementById("lootboxAction").textContent = "박스 열기";
  document.getElementById("lootbox-overlay").classList.add("show");
};

document.getElementById("lootboxAction").onclick = () => {
  if (!lootboxOpened) {
    lootboxOpened = true;
    const card = document.getElementById("lootbox-card");
    card.classList.add("opening");
    document.getElementById("lootboxDesc").textContent = "여는 중...";
    document.getElementById("lootboxAction").textContent = "여는 중...";
    setTimeout(() => {
      const b = BONUS_REWARDS[Math.floor(Math.random() * BONUS_REWARDS.length)];
      const pts = [40, 60, 80, 100][Math.floor(Math.random() * 4)];
      points += pts; save(LS.points, points); renderPoints();
      card.classList.remove("opening");
      document.getElementById("lootboxEmoji").textContent = b.emoji;
      document.getElementById("lootboxTitle").textContent = b.title;
      document.getElementById("lootboxDesc").textContent = b.desc;
      document.getElementById("lootboxPts").textContent = "+" + pts + "P";
      document.getElementById("lootboxAction").textContent = "받기!";
    }, 550);
  } else {
    document.getElementById("lootbox-overlay").classList.remove("show");
    lootboxPending = false;
  }
};

renderAll();
</script>
</body>
</html>
